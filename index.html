<style>
[hidden]{display:none !important}
body{margin:0;background:#1b1d2e}
a{color:inherit}a:hover{color:inherit}
@keyframes fadeIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
@keyframes starPulse{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
@keyframes snow{from{background-position:0 0,0 0}to{background-position:40px 720px,-60px 720px}}
.scr{animation:fadeIn .55s ease both}
.star{transition:transform .25s ease, filter .25s ease}
.star:hover{transform:rotate(20deg) scale(1.08);filter:brightness(1.15)}
.star-big{animation:starPulse 3.2s ease-in-out infinite}
.sq{transition:background .2s ease, transform .2s ease}
.sq:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.arrow{transition:transform .2s ease}
.arrow:hover{transform:translateX(6px)}
.arrow-l:hover{transform:translateX(-6px)}
.snowlayer{background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 90px 120px,rgba(255,255,255,.6),transparent);background-size:140px 160px,200px 220px;animation:snow 14s linear infinite}
@keyframes stroll{0%{left:-4px}47%{left:calc(100% - 106px)}50%{left:calc(100% - 106px)}97%{left:-4px}100%{left:-4px}}
@keyframes face{0%,47%{transform:scaleX(-1)}50%,97%{transform:scaleX(1)}100%{transform:scaleX(-1)}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.85)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.walker-face{animation:face 28s linear infinite}
.bubble{animation:pop .2s ease-out both}
.walker-btn{cursor:pointer}
.walker-btn:active .walker-bob{filter:brightness(1.1) drop-shadow(0 4px 4px rgba(0,0,0,.35))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.walker{animation:stroll 28s linear infinite}
.walker-bob{animation:bob .45s ease-in-out infinite;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.walker,.walker-face,.walker-bob,.star-big,.snowlayer{animation:none}}
button:focus-visible,a:focus-visible{outline:3px solid #ffd27a;outline-offset:4px}
@keyframes stroll-m{0%{left:-4px}47%{left:calc(100% - 78px)}50%{left:calc(100% - 78px)}97%{left:-4px}100%{left:-4px}}
@media (max-width:760px){

.scr ul{font-size:15px !important;gap:3px !important}

.m-intro-text{left:28px !important;bottom:150px !important}
.m-intro-title{font-size:48px !important}
.star-big{width:112px !important;height:112px !important;right:28px !important;top:56px !important}
.m-star-tr{width:60px !important;height:60px !important;right:20px !important;top:24px !important}
.m-roke-text{left:24px !important;top:28px !important;max-width:calc(100% - 110px) !important;gap:10px !important}
.m-roke-img{width:80% !important;height:42% !important;top:47% !important}
.m-sq-l,.m-sq-r{min-width:0 !important;height:56px !important;padding:0 16px !important;bottom:148px !important}
.m-sq-l{left:20px !important;font-size:30px !important}
.m-sq-r{right:20px !important;font-size:28px !important}
.m-works-bg{width:100% !important;opacity:.28}
.m-works-title{right:auto !important;left:24px !important;top:28px !important;font-size:42px !important}
.m-works-list{left:20px !important;right:20px !important;top:110px !important;bottom:150px !important;gap:28px !important}
.split{gap:16px !important}
.m-cover{width:92px !important;height:126px !important}
.m-work-text{font-size:22px !important}
.split a.star{width:56px !important;height:56px !important}
.m-p-img{width:84% !important;height:44% !important;top:40% !important}
.m-p-logo{right:auto !important;left:24px !important;top:24px !important;font-size:34px !important}

.m-arrow:not(.arrow-l){right:20px !important}

.walker-btn,.walker-face,.walker-bob{width:80px !important;height:93px !important}

}
</style>

<script>
(function(){
  var screens=document.querySelectorAll('[data-screen]');
  function go(n){screens.forEach(function(s){s.hidden=String(n)!==s.getAttribute('data-screen');});}
  document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'));});});
  var lines=[['후에엥 아프자나여..',3],['지인도 없는데 때리지마세여...',3],['맴매형할게요.',1],['노옹~.',3],['으에.. 아프다..',3]];
  var madLines=['맴매!','이리와보세용.','방망이 무겁다요..','때찌때찌'];
  var TRIGGER='맴매형할게요.', bubble=document.getElementById('bubble'), txt=document.getElementById('bubble-text'), img=document.getElementById('walker-img');
  var cur='', mad=false, t=null, mt=null;
  function pick(){
    if(mad){var m=madLines.filter(function(x){return x!==cur;});return m[Math.floor(Math.random()*m.length)];}
    var p=lines.filter(function(l){return l[0]!==cur;}),tot=p.reduce(function(a,l){return a+l[1];},0),r=Math.random()*tot;
    for(var i=0;i<p.length;i++){r-=p[i][1];if(r<0)return p[i][0];}return p[p.length-1][0];
  }
  document.getElementById('walker-btn').addEventListener('click',function(){
    var next=pick(), goMad=!mad&&next===TRIGGER; cur=next;
    bubble.hidden=true; void bubble.offsetWidth; txt.textContent=next; bubble.hidden=false;
    clearTimeout(t); t=setTimeout(function(){bubble.hidden=true;cur='';},2200);
    if(goMad){mad=true;img.src='img/chibi-bat.png';clearTimeout(mt);mt=setTimeout(function(){mad=false;img.src='img/chibi.png';},5000);}
  });
})();
</script>
