<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040506);
scene.fog = new THREE.FogExp2(0x040506, 0.18);

const camera = new THREE.PerspectiveCamera(42, 1, 0.02, 60);
camera.position.set(0.68, 1.3, 0.92);

const D = 0.75; // desk top height

/* ---------- helpers ---------- */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
function add(geo, m, x, y, z, parent = scene, cast = true, receive = true) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast; mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}
const box = (w, h, d, m, x, y, z, p, c, r) => add(new THREE.BoxGeometry(w, h, d), m, x, y, z, p, c, r);
const rbox = (w, h, d, rad, m, x, y, z, p) => add(new RoundedBoxGeometry(w, h, d, 3, rad), m, x, y, z, p);
function cylBetween(a, b, r, m, parent = scene) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const mesh = add(new THREE.CylinderGeometry(r, r, dir.length(), 16), m, 0, 0, 0, parent);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- materials ---------- */
const M = {
  plastic: mat(0xe3dfd5, { roughness: 0.5 }),
  plastic2: mat(0xd8d3c7, { roughness: 0.55 }),
  keycap: mat(0xebe8df, { roughness: 0.55 }),
  black: mat(0x0c0c0e, { roughness: 0.8 }),
  dark: mat(0x1a1c21, { roughness: 0.7 }),
  metal: mat(0x3b4048, { roughness: 0.42, metalness: 0.65 }),
  metalDark: mat(0x22252b, { roughness: 0.4, metalness: 0.7 }),
  wall: mat(0x1b1f27, { roughness: 0.95 }),
  paper: mat(0xd9d6cc, { roughness: 0.9 }),
};
M.wood = mat(0xffffff, {
  roughness: 0.55,
  map: canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#3d2a1e'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      const y = Math.random() * h;
      g.strokeStyle = `rgba(${Math.random() < .5 ? '20,12,6' : '92,64,44'},${rnd(.08, .3)})`;
      g.lineWidth = rnd(.5, 2.5);
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 64) g.lineTo(x, y + Math.sin(x * .004 + i) * rnd(2, 6));
      g.stroke();
    }
  }),
});
M.carpet = mat(0xffffff, {
  roughness: 1,
  map: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#16181e'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) {
      const v = Math.floor(rnd(10, 40));
      g.fillStyle = `rgb(${v},${v + 2},${v + 8})`;
      g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
  }, [14, 14]),
});

/* ---------- room ---------- */
const floor = add(new THREE.PlaneGeometry(14, 14), M.carpet, 0, 0, 1, scene, false, true);
floor.rotation.x = -Math.PI / 2;
const ceil = add(new THREE.PlaneGeometry(14, 14), mat(0x0d0f13), 0, 2.9, 1, scene, false, false);
ceil.rotation.x = Math.PI / 2;

// back wall with window hole  (window: x -0.95..0.95, y 1.05..2.35)
const WZ = -1.0;
box(7, 1.05, 0.1, M.wall, 0, 0.525, WZ);
box(7, 0.55, 0.1, M.wall, 0, 2.625, WZ);
box(3.05, 1.3, 0.1, M.wall, -2.475, 1.7, WZ);
box(3.05, 1.3, 0.1, M.wall, 2.475, 1.7, WZ);
const sideL = add(new THREE.PlaneGeometry(6, 3), M.wall, -3.2, 1.5, 1.5, scene, false, true); sideL.rotation.y = Math.PI / 2;
const sideR = add(new THREE.PlaneGeometry(6, 3), M.wall, 3.2, 1.5, 1.5, scene, false, true); sideR.rotation.y = -Math.PI / 2;
// window frame
const frameM = mat(0x2a2e36, { roughness: 0.5, metalness: 0.3 });
box(1.98, 0.04, 0.14, frameM, 0, 1.05, WZ);
box(1.98, 0.04, 0.12, frameM, 0, 2.35, WZ);
box(0.04, 1.34, 0.12, frameM, -0.97, 1.7, WZ);
box(0.04, 1.34, 0.12, frameM, 0.97, 1.7, WZ);
box(0.03, 1.3, 0.06, frameM, 0, 1.7, WZ);
box(2.1, 0.03, 0.22, mat(0x262a31), 0, 1.03, WZ + 0.06); // sill
// blinds (half lowered)
const slatM = mat(0x8b8f96, { roughness: 0.6, metalness: 0.2 });
for (let i = 0; i < 15; i++) {
  const s = box(1.86, 0.004, 0.034, slatM, 0, 2.3 - i * 0.042, WZ + 0.08);
  s.rotation.x = 0.75;
}
box(1.9, 0.03, 0.05, slatM, 0, 2.33, WZ + 0.08);
box(1.86, 0.012, 0.04, slatM, 0, 2.3 - 15 * 0.042, WZ + 0.08);
for (const x of [-0.6, 0.6]) box(0.003, 0.64, 0.003, slatM, x, 2.0, WZ + 0.08, scene, false);

// night city outside
const city = canvasTex(2048, 1024, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#04060f'); sky.addColorStop(.6, '#0d1028'); sky.addColorStop(1, '#2a1f3a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(255,255,255,${rnd(.1, .5)})`; g.fillRect(Math.random() * w, Math.random() * h * .4, 1.5, 1.5); }
  // moon
  const mx = 1500, my = 170;
  const glow = g.createRadialGradient(mx, my, 10, mx, my, 220);
  glow.addColorStop(0, 'rgba(180,190,210,.18)'); glow.addColorStop(1, 'rgba(200,215,255,0)');
  g.fillStyle = glow; g.fillRect(mx - 240, my - 240, 480, 480);
  g.fillStyle = '#9aa0ad'; g.beginPath(); g.arc(mx, my, 46, 0, 7); g.fill();
  g.fillStyle = 'rgba(170,180,210,.35)'; g.beginPath(); g.arc(mx - 12, my - 8, 10, 0, 7); g.arc(mx + 16, my + 14, 7, 0, 7); g.fill();
  const layer = (base, hmin, hmax, lit, alpha) => {
    let x = -20;
    while (x < w) {
      const bw = rnd(60, 190), bh = rnd(hmin, hmax), top = h - bh;
      g.fillStyle = base; g.fillRect(x, top, bw, bh);
      if (Math.random() < .25) g.fillRect(x + bw * .4, top - 40, 4, 40);
      for (let wy = top + 14; wy < h - 10; wy += 22)
        for (let wx = x + 10; wx < x + bw - 12; wx += 18)
          if (Math.random() < lit) {
            g.fillStyle = Math.random() < .7 ? `rgba(255,${200 + Math.random() * 40 | 0},130,${alpha})` : `rgba(150,200,255,${alpha})`;
            g.fillRect(wx, wy, 9, 12);
          }
      x += bw + rnd(4, 30);
    }
  };
  layer('#0c0e16', 300, 700, .04, .3);
  layer('#06070b', 200, 520, .06, .6);
});
const cityMesh = add(new THREE.PlaneGeometry(10, 5), new THREE.MeshBasicMaterial({ map: city, fog: false }), 0.4, 1.6, -5, scene, false, false);

/* ---------- desk ---------- */
const DZ = -0.5;
rbox(1.6, 0.04, 0.9, 0.006, M.wood, 0, D - 0.02, DZ);
const legM = mat(0x2b1e16, { roughness: 0.6 });
box(0.04, D - 0.04, 0.85, legM, -0.76, (D - 0.04) / 2, DZ);
box(0.04, D - 0.04, 0.85, legM, 0.76, (D - 0.04) / 2, DZ);
box(1.48, 0.45, 0.02, legM, 0, 0.47, DZ - 0.4);

/* ---------- computer case ---------- */
const CZ = -0.6;
rbox(0.48, 0.15, 0.42, 0.012, M.plastic, 0, D + 0.075, CZ);
const FZ = CZ + 0.21; // front face
box(0.21, 0.112, 0.004, M.plastic2, -0.11, D + 0.075, FZ + 0.001);
box(0.2, 0.038, 0.004, M.plastic2, 0.115, D + 0.105, FZ + 0.001);
box(0.165, 0.006, 0.004, M.black, 0.115, D + 0.108, FZ + 0.003);
box(0.05, 0.0062, 0.0045, mat(0x8d8a82), 0.065, D + 0.108, FZ + 0.0035);
for (const x of [0.04, 0.066]) {
  const b = add(new THREE.CylinderGeometry(0.0085, 0.0085, 0.006, 20), M.plastic2, x, D + 0.042, FZ + 0.003);
  b.rotation.x = Math.PI / 2;
}
rbox(0.032, 0.015, 0.008, 0.002, M.plastic2, 0.185, D + 0.062, FZ + 0.002);
const caseLED = box(0.006, 0.003, 0.003, new THREE.MeshBasicMaterial({ color: 0x7dff6a }), 0.145, D + 0.062, FZ + 0.003, scene, false, false);

/* ---------- CRT monitor ---------- */
const baseTop = D + 0.15;
add(new THREE.CylinderGeometry(0.11, 0.115, 0.016, 48), M.plastic, 0, baseTop + 0.008, CZ - 0.01);
add(new THREE.CylinderGeometry(0.055, 0.075, 0.03, 32), M.plastic, 0, baseTop + 0.031, CZ - 0.01);
const MY = baseTop + 0.046 + 0.17; // bezel center
const BZ = -0.515;                 // bezel center z (front face at -0.48)
rbox(0.4, 0.34, 0.07, 0.02, M.plastic, 0, MY, BZ);
// tapered tube
{
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const front = p.getZ(i) > 0;
    const x = p.getX(i), y = p.getY(i);
    if (front) { p.setXYZ(i, x * 0.37, y * 0.31, 0); }
    else { p.setXYZ(i, x * 0.22, y * 0.19 - 0.025, -0.3); }
  }
  geo.computeVertexNormals();
  add(geo, M.plastic, 0, MY, BZ - 0.03);
  // back cap + vents
  rbox(0.2, 0.17, 0.02, 0.01, M.plastic2, 0, MY - 0.025, BZ - 0.33);
}
// screen recess + glass
const SWm = 0.312, SHm = 0.236, SCY = MY + 0.014, SZ = BZ + 0.035;
box(SWm + 0.03, SHm + 0.03, 0.004, mat(0xcfcabd, { roughness: .5 }), 0, SCY, SZ + 0.002, scene, false);
box(SWm + 0.008, SHm + 0.008, 0.004, M.black, 0, SCY, SZ + 0.003, scene, false);
const screenGeo = new THREE.PlaneGeometry(SWm, SHm, 32, 24);
{
  const p = screenGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) / (SWm / 2), v = p.getY(i) / (SHm / 2);
    p.setZ(i, 0.007 * (1 - u * u * 0.6) * (1 - v * v * 0.6));
  }
  screenGeo.computeVertexNormals();
}
// buttons
const btnY = MY - 0.143;
for (const x of [0.07, 0.095, 0.12]) {
  const b = add(new THREE.CylinderGeometry(0.0075, 0.0075, 0.006, 20), M.plastic2, x, btnY, BZ + 0.036);
  b.rotation.x = Math.PI / 2;
  if (x === 0.12) b.userData.kind = 'power';
  if (x === 0.12) var powerBtn = b;
}
const ledMat = new THREE.MeshBasicMaterial({ color: 0x8dff6a });
const monLED = rbox(0.01, 0.006, 0.004, 0.002, ledMat, 0.143, btnY, BZ + 0.036);

/* ---------- screen (2D OS on canvas) ---------- */
const SW = 640, SH = 480;
const sc = document.createElement('canvas'); sc.width = SW; sc.height = SH;
const g = sc.getContext('2d');
const screenTex = new THREE.CanvasTexture(sc);
screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 8;
const screenMat = new THREE.MeshBasicMaterial({ map: screenTex, color: 0x9a9e9e, toneMapped: false });
const screen = add(screenGeo, screenMat, 0, SCY, SZ + 0.0045, scene, false, false);

const offTex = canvasTex(320, 240, (c, w, h) => {
  const gr = c.createLinearGradient(0, 0, w, h);
  gr.addColorStop(0, '#5b606d'); gr.addColorStop(.5, '#3f434d'); gr.addColorStop(1, '#2f323a');
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  const hl = c.createRadialGradient(40, 30, 5, 60, 50, 160);
  hl.addColorStop(0, 'rgba(255,255,255,.22)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.fillRect(0, 0, w, h);
});
const offMat = new THREE.MeshStandardMaterial({ map: offTex, roughness: 0.15, metalness: 0.1 });

const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
const os = {
  cx: SW / 2, cy: SH / 2, on: true, boot: 0, shutdown: false,
  selected: -1, win: null, menu: false, notes: '', last: { t: 0, i: -1 }, dirty: true,
};
const icons = [
  { id: 'pc', label: '내 컴퓨터', x: 24, y: 22 },
  { id: 'docs', label: '문서', x: 24, y: 104 },
  { id: 'notes', label: '메모장', x: 24, y: 186 },
  { id: 'trash', label: '휴지통', x: 24, y: 268 },
];
const TITLES = { pc: '내 컴퓨터', docs: '문서', notes: '메모장 - 제목 없음', trash: '휴지통' };
const TB = 34; // taskbar height
const MENU = { x: 2, y: SH - TB - 142, w: 190, h: 140, items: [['pc', '내 컴퓨터'], ['notes', '메모장'], ['off', '시스템 종료…']] };

function bevel(x, y, w, h, inset, face = '#c3c3c3') {
  g.fillStyle = face; g.fillRect(x, y, w, h);
  g.fillStyle = inset ? '#7b7b7b' : '#ffffff'; g.fillRect(x, y, w, 2); g.fillRect(x, y, 2, h);
  g.fillStyle = inset ? '#ffffff' : '#3d3d3d'; g.fillRect(x, y + h - 2, w, 2); g.fillRect(x + w - 2, y, 2, h);
}
function drawIcon(id, cx, y) {
  g.lineWidth = 2; g.strokeStyle = '#111';
  if (id === 'pc') {
    g.fillStyle = '#e8e4d8'; g.fillRect(cx - 19, y, 38, 29); g.strokeRect(cx - 19, y, 38, 29);
    g.fillStyle = '#1f5fa8'; g.fillRect(cx - 14, y + 4, 28, 19);
    g.fillStyle = '#e8e4d8'; g.fillRect(cx - 16, y + 32, 32, 8); g.strokeRect(cx - 16, y + 32, 32, 8);
  } else if (id === 'docs') {
    g.fillStyle = '#e8c246'; g.fillRect(cx - 20, y + 4, 15, 8); g.strokeRect(cx - 20, y + 4, 15, 8);
    g.fillRect(cx - 20, y + 9, 40, 29); g.strokeRect(cx - 20, y + 9, 40, 29);
    g.fillStyle = '#f6db79'; g.fillRect(cx - 18, y + 14, 36, 4);
  } else if (id === 'notes') {
    g.fillStyle = '#fff'; g.fillRect(cx - 15, y, 30, 40); g.strokeRect(cx - 15, y, 30, 40);
    g.fillStyle = '#2f62c9'; g.fillRect(cx - 14, y + 1, 28, 6);
    g.fillStyle = '#9aa'; for (let i = 0; i < 5; i++) g.fillRect(cx - 10, y + 12 + i * 5.5, 20, 1.5);
  } else if (id === 'trash') {
    g.fillStyle = '#b9bdc5';
    g.beginPath(); g.moveTo(cx - 15, y + 8); g.lineTo(cx + 15, y + 8); g.lineTo(cx + 11, y + 40); g.lineTo(cx - 11, y + 40); g.closePath(); g.fill(); g.stroke();
    g.fillRect(cx - 18, y + 3, 36, 5); g.strokeRect(cx - 18, y + 3, 36, 5);
    g.fillStyle = '#7d828b'; for (const dx of [-6, 0, 6]) g.fillRect(cx + dx - 1, y + 13, 2, 23);
  }
}
function wrap(text, maxW) {
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const ch of para) {
      if (g.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch;
    }
    out.push(line);
  }
  return out;
}
function drawWindow(w, now) {
  bevel(w.x, w.y, w.w, w.h);
  const tg = g.createLinearGradient(w.x, 0, w.x + w.w, 0);
  tg.addColorStop(0, '#0b2470'); tg.addColorStop(1, '#3d77b5');
  g.fillStyle = tg; g.fillRect(w.x + 4, w.y + 4, w.w - 8, 24);
  g.fillStyle = '#fff'; g.font = `bold 14px ${FONT}`; g.textBaseline = 'middle';
  g.fillText(w.title, w.x + 12, w.y + 16);
  bevel(w.x + w.w - 28, w.y + 7, 20, 18);
  g.fillStyle = '#000'; g.font = `bold 13px ${FONT}`; g.fillText('×', w.x + w.w - 23, w.y + 16);
  const cx = w.x + 8, cy = w.y + 34, cw = w.w - 16, ch = w.h - 42;
  bevel(cx, cy, cw, ch, true, '#ffffff');
  g.save(); g.beginPath(); g.rect(cx + 2, cy + 2, cw - 4, ch - 4); g.clip();
  g.fillStyle = '#111'; g.font = `15px ${FONT}`; g.textBaseline = 'top';
  if (w.id === 'pc') {
    const lines = [['프로세서', '486DX2 · 66 MHz'], ['메모리', '8,192 KB'], ['하드디스크 C:', '540 MB (여유 12 MB)'], ['그래픽', 'VGA 640×480 · 256색'], ['사운드', '내장 스피커 (삑)']];
    lines.forEach(([k, v], i) => {
      g.fillStyle = '#555'; g.fillText(k, cx + 16, cy + 16 + i * 30);
      g.fillStyle = '#111'; g.fillText(v, cx + 130, cy + 16 + i * 30);
    });
    g.fillStyle = '#2f62c9'; g.fillText('오늘 밤도 야근 중… ☕', cx + 16, cy + 176);
  } else if (w.id === 'docs') {

  box(0.04, 0.71, 0.75, legM, 1.29, 0.355, -0.5); box(0.04, 0.71, 0.75, legM, 2.61, 0.355, -0.5);
  rbox(0.38, 0.32, 0.34, 0.02, mat(0x8c887f, { roughness: .6 }), 1.95, D + 0.19, -0.62);
  box(0.28, 0.21, 0.004, mat(0x111316, { roughness: .2 }), 1.95, D + 0.2, -0.449);
}

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0x23262d, 0.16));
scene.add(new THREE.HemisphereLight(0x1d222c, 0x060505, 0.16));
const moon = new THREE.DirectionalLight(0x7f8899, 0.75);
moon.position.set(0.7, D + 3.0, -2.5);
moon.target.position.set(0, D, -0.25);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 8 });
moon.shadow.bias = -0.0005; moon.shadow.normalBias = 0.01;
scene.add(moon, moon.target);
const screenLight = new THREE.PointLight(0x7f9fa2, 0.45, 2.2, 2);
screenLight.position.set(0, SCY, SZ + 0.12);
scene.add(screenLight);

// moonbeam dust
const dustN = 260;
const dustGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(dustN * 3), dvel = [];
for (let i = 0; i < dustN; i++) {
  dpos.set([rnd(-0.9, 0.9), rnd(0.8, 2.2), rnd(-0.95, 0.4)], i * 3);
  dvel.push(rnd(0, Math.PI * 2));
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x9099a8, size: 0.005, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

/* ---------- sound (tiny synthesized clicks) ---------- */
let actx = null;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } return actx; }
function tick(vol = 0.25, len = 0.025, freq = 2400) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * len), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const gn = a.createGain(); gn.gain.value = vol;
  s.connect(f).connect(gn).connect(a.destination); s.start();
}
function beep(freq = 880, len = 0.12) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = 'square'; o.frequency.value = freq; gn.gain.value = 0.04;
  gn.gain.setTargetAtTime(0, a.currentTime + len * .7, 0.02);
  o.connect(gn).connect(a.destination); o.start(); o.stop(a.currentTime + len);
}

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const deskPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(D + 0.004));
const interactive = [mouse, lamp, powerBtn];
const BOUNDS = { x0: 0.245, x1: 0.71, z0: -0.33, z1: -0.1 };
const GAIN = 5200;
let drag = null, down = null, pressAnim = 0;

function aim(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function pick(e) {
  aim(e);
  for (const h of ray.intersectObjects(interactive, true)) {
    let o = h.object;
    while (o && !o.userData.kind) o = o.parent;
    if (o) return o.userData.kind;
  }
  return null;
}
const hitP = new THREE.Vector3();
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  const kind = pick(e);
  down = { x: e.clientX, y: e.clientY, kind };
  if (kind === 'mouse' && ray.ray.intersectPlane(deskPlane, hitP)) {
    controls.enabled = false;
    drag = { off: hitP.clone().sub(mouse.position), dist: 0 };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
  }
});
canvas.addEventListener('pointermove', e => {
  if (drag) {
    aim(e);
    if (!ray.ray.intersectPlane(deskPlane, hitP)) return;
    const nx = THREE.MathUtils.clamp(hitP.x - drag.off.x, BOUNDS.x0, BOUNDS.x1);
    const nz = THREE.MathUtils.clamp(hitP.z - drag.off.z, BOUNDS.z0, BOUNDS.z1);
    const dx = nx - mouse.position.x, dz = nz - mouse.position.z;
    mouse.position.x = nx; mouse.position.z = nz;
    mouse.rotation.y = THREE.MathUtils.lerp(mouse.rotation.y, -dx * 6, 0.3);
    drag.dist += Math.hypot(e.movementX || 0, e.movementY || 0);
    if (dx || dz) {
      os.cx = THREE.MathUtils.clamp(os.cx + dx * GAIN, 0, SW - 2);
      os.cy = THREE.MathUtils.clamp(os.cy + dz * GAIN, 0, SH - 2);
      os.dirty = true;
      updateCord();
    }
    return;
  }
  if (e.buttons) return;
  const k = pick(e);
  canvas.style.cursor = k === 'mouse' ? 'grab' : k ? 'pointer' : '';
});
canvas.addEventListener('pointerup', e => {
  const moved = down ? Math.hypot(e.clientX - down.x, e.clientY - down.y) : 99;
  if (drag) {
    if (moved < 5) { // a click on the mouse = click on the computer
      pressAnim = performance.now(); tick(0.35, 0.02, 3200); osClick();
    }
    drag = null; controls.enabled = true;
    canvas.style.cursor = 'grab';
  } else if (down && moved < 5) {
    if (down.kind === 'lamp') toggleLamp();
    else if (down.kind === 'power') togglePower();
  }
  down = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; down = null; controls.enabled = true; });

function toggleLamp() {
  lampOn = !lampOn; tick(0.5, 0.03, 1400);
  spot.visible = lampOn;
  bulbMat.emissiveIntensity = lampOn ? 1.5 : 0;
  bulbMat.color.set(lampOn ? 0xfff0d0 : 0x777066);
}
function togglePower() {
  tick(0.4, 0.03, 1800);
  os.on = !os.on;
  if (os.on) {
    screen.material = screenMat; os.boot = performance.now() + 1600; os.shutdown = false;
    os.win = null; os.menu = false; os.selected = -1;
    beep(1046, 0.1);
  } else screen.material = offMat;
  screenLight.visible = os.on;
  ledMat.color.set(os.on ? 0x8dff6a : 0xffa53a);
  os.dirty = true;
}

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  let k = e.key;
  const ki = KOR.indexOf(k); if (ki >= 0) k = ENG[ki];
  const base = keyMap[k.toLowerCase?.() ?? k] ?? keyMap[shiftMap[k]] ?? keyMap[k];
  if (base !== undefined) { pressed.set(base, performance.now()); tick(0.12, 0.018, 2600); }
  if (os.on && !os.shutdown && os.win?.id === 'notes') {
    if (e.key === 'Backspace') os.notes = os.notes.slice(0, -1);
    else if (e.key === 'Enter') os.notes += '\n';
    else if (e.key.length === 1) os.notes = (os.notes + e.key).slice(-1200);
    os.dirty = true;
    e.preventDefault();
  } else if (e.key === ' ') e.preventDefault();
});

/* ---------- orbit controls (after our pointerdown, so we can disable it first) ---------- */
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.05, 0.95, -0.45);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 1.15; controls.maxDistance = 1.65;
controls.minPolarAngle = 1.18; controls.maxPolarAngle = 1.45;
controls.minAzimuthAngle = 0.12; controls.maxAzimuthAngle = 0.72;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.5;

/* ---------- resize + loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 62 : 42;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let lastSec = -1, lastBlink = -1;
const clock = new THREE.Clock();
function loop() {
  const now = performance.now(), dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  controls.update();

  // screen redraw only when needed
  const sec = Math.floor(Date.now() / 1000), blink = Math.floor(now / 500);
  if (os.on && (os.dirty || sec !== lastSec || now < os.boot + 50 || (os.win?.id === 'notes' && blink !== lastBlink))) {
    drawOS(now); screenTex.needsUpdate = true; os.dirty = false;
  }
  lastSec = sec; lastBlink = blink;
  screenLight.intensity = 0.45 + Math.sin(t * 60) * 0.012 + (now < os.boot ? -0.3 : 0);

  // mouse click dip
  const pa = (now - pressAnim) / 140;
  mouse.position.y = D + 0.004 - (pa < 1 ? Math.sin(pa * Math.PI) * 0.0015 : 0);
  if (!drag) mouse.rotation.y *= 0.9;

  // key presses
  if (pressed.size) {
    for (const [i, t0] of pressed) {
      const p = (now - t0) / 130;
      if (p >= 1) { setKey(i, 0); pressed.delete(i); } else setKey(i, Math.sin(p * Math.PI) * 0.004);
    }
    keys.instanceMatrix.needsUpdate = true;
  }

  // dust
  const a = dust.geometry.attributes.position;
  for (let i = 0; i < dustN; i++) {
    dvel[i] += dt * 0.3;
    a.array[i * 3] += Math.sin(dvel[i]) * 0.0004;
    a.array[i * 3 + 1] += Math.cos(dvel[i] * 0.7) * 0.0003 - 0.00005;
    if (a.array[i * 3 + 1] < 0.75) a.array[i * 3 + 1] = 2.2;
  }
  a.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
document.getElementById('loading').remove();
loop();
</script>
<script>
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.textContent = '3D 라이브러리를 불러오지 못했어요. 새로고침해 주세요.'; }, 12000);
</script>
